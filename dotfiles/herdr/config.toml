# herdr configuration
#
# Reference for every available option:
#   herdr --default-config
#
# After a change, reload without restarting the session by doing:
#   - herdr server reload-config
#   - prefix + Shift + R (from inside herdr)

onboarding = false

[theme]
name = "nord"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  [ "state_icon", { token = "tab", fg = "#ebebeb", bold = true, dim = false }],
  [ { token = "terminal_title_stripped", fg = "#8c8c8c" }]
]

[ui.toast]
delivery = "herdr"
