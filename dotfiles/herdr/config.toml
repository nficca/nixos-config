# herdr configuration
#
# Reference for every available option:
#   herdr --default-config
#
# After a change, reload without restarting the session by doing:
#   - herdr server reload-config
#   - prefix + Shift + R (from inside herdr)

onboarding = false

[theme]
name = "nord"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  [ "state_icon", { token = "terminal_title_stripped", fg = "#fafafa", dim = false } ],
  [ { token = "tab", fg = "#fafafa", bold = false, dim = true }, { token = "workspace", fg = "#b8b8b8", bold = false, dim = true } ] ]

[ui.toast]
delivery = "herdr"
