# herdr configuration
#
# Reference for every available option:
#   herdr --default-config
#
# After a change, reload without restarting the session by doing:
#   - herdr server reload-config
#   - prefix + Shift + R (from inside herdr)

onboarding = false

[theme]
name = "nord"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  [ "state_icon", { token = "terminal_title_stripped", fg = "#fafafa", dim = false } ],
  [ { token = "tab", fg = "#fafafa", bold = false, dim = true }, { token = "workspace", fg = "#b8b8b8", bold = false, dim = true } ] ]

[ui.toast]
delivery = "herdr"

[keys]
focus_pane_left = ["prefix+h", "ctrl+alt+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+l", "ctrl+alt+right"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
